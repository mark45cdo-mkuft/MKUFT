name: One-shot clean FSSR-HCP audit
on:
  push:
    paths:
      - '.github/workflows/one-shot-clean-fssr-hcp-audit.yml'
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Restore tracked checker bytecode to pre-audit state
        run: |
          git checkout d212fc30f76c9935b89f51141ef7bca884ae50ee -- tools/__pycache__/check_markdown_rendering.cpython-312.pyc tools/__pycache__/check_research_object_identity.cpython-312.pyc
      - name: Re-run standing gates without bytecode mutation
        run: |
          python tools/test_markdown_rendering_checker.py
          python tools/check_markdown_rendering.py
          python tools/check_publication_routes.py
          python tools/check_atld2_publication_routes.py
          python tools/test_research_object_identity_checker.py
          python tools/check_research_object_identity.py
          grep -Fq '\mathrm{UpperTail}_{\mathrm{pre}}' docs/28C_FSAI_FSSR_MINIMUM_DECISIVE_FLAGSHIP_HCP_MAGNESIUM_PROTOCOL.md
          grep -Fq '52192346256eb3c5895ed466f913b23ce1bb3a8476fdc555edc2abff2dc6646a' publications/FSSR_HCP_MAGNESIUM_MINIMUM_DECISIVE_PROTOCOL_v1.0/SHA256SUMS.txt
      - name: Remove cleanup scaffold and commit only cleanup delta
        run: |
          rm .github/workflows/one-shot-clean-fssr-hcp-audit.yml
          git config user.name "MKUFT Publication Audit"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Restore checker artifacts after FSSR-HCP audit"
          git push
