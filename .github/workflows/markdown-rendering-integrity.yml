name: Publication and Markdown integrity

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'tools/check_markdown_rendering.py'
      - 'tools/check_publication_routes.py'
      - '.github/workflows/markdown-rendering-integrity.yml'
  pull_request:
    paths:
      - '**/*.md'
      - 'tools/check_markdown_rendering.py'
      - 'tools/check_publication_routes.py'
      - '.github/workflows/markdown-rendering-integrity.yml'

permissions:
  contents: read

jobs:
  integrity-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check user-facing Markdown rendering contract
        run: python tools/check_markdown_rendering.py
      - name: Check publication discovery and DOI custody
        run: python tools/check_publication_routes.py
      - name: Export exact checked-in MKUFT reading editions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mkuft-reading-editions-export
          path: |
            publications/module-reading-editions/*.pdf
            publications/module-reading-editions/SHA256SUMS.txt
            publications/module-reading-editions/README.md
          if-no-files-found: error
          retention-days: 1
