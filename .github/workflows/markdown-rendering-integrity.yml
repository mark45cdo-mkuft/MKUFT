name: Publication and Markdown integrity

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'codemeta.json'
      - 'CITATION.cff'
      - 'publications/ATLD_Evaluation_Protocol_v1.0/**'
      - 'tools/check_markdown_rendering.py'
      - 'tools/test_markdown_rendering_checker.py'
      - 'tools/check_publication_routes.py'
      - '.github/workflows/markdown-rendering-integrity.yml'
  pull_request:
    paths:
      - '**/*.md'
      - 'codemeta.json'
      - 'CITATION.cff'
      - 'publications/ATLD_Evaluation_Protocol_v1.0/**'
      - 'tools/check_markdown_rendering.py'
      - 'tools/test_markdown_rendering_checker.py'
      - 'tools/check_publication_routes.py'
      - '.github/workflows/markdown-rendering-integrity.yml'

concurrency:
  group: publication-markdown-integrity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  integrity-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Self-test the Markdown rendering guard
        run: python tools/test_markdown_rendering_checker.py
      - name: Check user-facing Markdown rendering contract
        run: python tools/check_markdown_rendering.py
      - name: Check publication discovery and DOI custody
        run: python tools/check_publication_routes.py

  populate-publication-pdf-mirrors:
    name: One-shot frozen DOI PDF mirror closure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fetch and verify exact Zenodo PDF objects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publications

          fetch_one() {
            record="$1"
            expected_doi="$2"
            output="$3"
            json="$(mktemp)"
            curl -fsSL "https://zenodo.org/api/records/${record}" -o "$json"

            actual_doi="$(jq -r '.doi // empty' "$json")"
            if [ "$actual_doi" != "$expected_doi" ]; then
              echo "ERROR: Zenodo record ${record} reports DOI '${actual_doi}', expected '${expected_doi}'." >&2
              exit 1
            fi

            mapfile -t keys < <(jq -r '.files[] | select(.key | ascii_downcase | endswith(".pdf")) | .key' "$json")
            mapfile -t urls < <(jq -r '.files[] | select(.key | ascii_downcase | endswith(".pdf")) | (.links.content // .links.self)' "$json")

            if [ "${#keys[@]}" -ne 1 ] || [ "${#urls[@]}" -ne 1 ]; then
              echo "ERROR: Zenodo record ${record} exposes ${#keys[@]} PDF files; expected exactly one." >&2
              printf 'PDF keys: %s\n' "${keys[*]:-NONE}" >&2
              exit 1
            fi

            expected_checksum="$(jq -r --arg key "${keys[0]}" '.files[] | select(.key == $key) | (.checksum // empty)' "$json")"

            echo "Record ${record}: ${keys[0]} -> ${output}"
            curl -fsSL "${urls[0]}" -o "$output"
            test "$(head -c 5 "$output")" = '%PDF-'
            test -s "$output"

            if [ -n "$expected_checksum" ]; then
              algorithm="${expected_checksum%%:*}"
              expected_hash="${expected_checksum#*:}"
              case "$algorithm" in
                md5) actual_hash="$(md5sum "$output" | awk '{print $1}')" ;;
                sha256) actual_hash="$(sha256sum "$output" | awk '{print $1}')" ;;
                *) echo "ERROR: unsupported Zenodo checksum algorithm '${algorithm}' for ${record}." >&2; exit 1 ;;
              esac
              if [ "$actual_hash" != "$expected_hash" ]; then
                echo "ERROR: checksum mismatch for Zenodo record ${record}." >&2
                exit 1
              fi
              echo "Zenodo checksum verified: ${expected_checksum}"
            fi

            sha256sum "$output"
            rm -f "$json"
          }

          fetch_one 21973064 '10.5281/zenodo.21973064' 'publications/MKUFT_RELATIONAL_ARCHITECTURE_v2_DOI_10.5281_zenodo.21973064.pdf'
          fetch_one 17780566 '10.5281/zenodo.17780566' 'publications/HISTORICAL_V1_MKUFT_DOI_10.5281_zenodo.17780566.pdf'
          fetch_one 22058303 '10.5281/zenodo.22058303' 'publications/FUTURE_SPLITTING_STATE_RECRUITMENT_v1.0_DOI_10.5281_zenodo.22058303.pdf'
          fetch_one 22031333 '10.5281/zenodo.22031333' 'publications/ADDRESSED_ADMISSIBLE_FUTURES_v0.1_DOI_10.5281_zenodo.22031333.pdf'
          fetch_one 21971270 '10.5281/zenodo.21971270' 'publications/LAYER_BEFORE_LAW_v1.0_DOI_10.5281_zenodo.21971270.pdf'
          fetch_one 21971425 '10.5281/zenodo.21971425' 'publications/RECURSIVE_CONSTRAINT_CLOSURE_v0.1_DOI_10.5281_zenodo.21971425.pdf'
          fetch_one 21341521 '10.5281/zenodo.21341521' 'publications/ATLD_EVALUATION_PROTOCOL_v1.0_DOI_10.5281_zenodo.21341521.pdf'

      - name: Commit mirrors, remove carriers, and restore integrity workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git show "${GITHUB_SHA}^:.github/workflows/markdown-rendering-integrity.yml" > .github/workflows/markdown-rendering-integrity.yml
          git add publications/*.pdf .github/workflows/markdown-rendering-integrity.yml
          git rm .github/workflows/populate_publication_pdf_mirrors.yml

          git commit -m 'Close frozen DOI PDF mirror population'
          git push

  persist-integrity-signal:
    name: Persist integrity status
    if: always() && github.event_name == 'push'
    needs: integrity-contract
    runs-on: ubuntu-latest
    steps:
      - name: Record the persistent integrity ledger
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.integrity-contract.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ISSUE_TITLE: Automated publication integrity gate failure
        run: |
          set -euo pipefail

          issue_json="$(
            gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state all \
              --search "\"$ISSUE_TITLE\" in:title" \
              --limit 1 \
              --json number,state
          )"
          issue_number="$(jq -r '.[0].number // empty' <<<"$issue_json")"
          issue_state="$(jq -r '.[0].state // empty' <<<"$issue_json")"

          if [ "$RESULT" = "success" ]; then
            if [ -z "$issue_number" ]; then
              issue_url="$(
                gh issue create \
                  --repo "$GITHUB_REPOSITORY" \
                  --title "$ISSUE_TITLE" \
                  --body "Persistent machine ledger for the Publication and Markdown integrity workflow. A closed issue means the most recently recorded main-branch run is green; a reopened issue means the gate is red. Initial green run: $RUN_URL"
              )"
              issue_number="${issue_url##*/}"
              gh issue close "$issue_number" \
                --repo "$GITHUB_REPOSITORY" \
                --comment "GREEN — integrity contract passed on main: $RUN_URL"
            elif [ "$issue_state" = "OPEN" ]; then
              gh issue close "$issue_number" \
                --repo "$GITHUB_REPOSITORY" \
                --comment "GREEN — integrity contract recovered on main: $RUN_URL"
            else
              gh issue comment "$issue_number" \
                --repo "$GITHUB_REPOSITORY" \
                --body "GREEN — integrity contract passed on main: $RUN_URL"
            fi
            exit 0
          fi

          if [ -z "$issue_number" ]; then
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$ISSUE_TITLE" \
              --body "RED — the Publication and Markdown integrity workflow is not green on main. Do not call publication-facing work closed until a later run passes. Current run: $RUN_URL"
          elif [ "$issue_state" = "CLOSED" ]; then
            gh issue reopen "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --comment "RED — integrity contract failed again on main: $RUN_URL"
          else
            gh issue comment "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --body "RED — integrity contract is still not green on main: $RUN_URL"
          fi
