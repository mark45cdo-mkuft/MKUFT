name: Temporary MKUFT current-frontier pin

on:
  push:
    paths:
      - '.github/workflows/_temp_frontier_pin.yml'

permissions:
  contents: write

jobs:
  pin-frontier:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Insert current-frontier pin
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          spine = Path('MKUFT_INTEGRATED_MASTER_SPINE.md')
          overview = Path('START_HERE_PUBLIC_OVERVIEW.md')

          old_spine = '''If those burdens are not met, the capstone remains a coherent architectural factorisation rather than completed fundamental unification.\n\n## 13. Experimental and promotion discipline'''
          new_spine = '''If those burdens are not met, the capstone remains a coherent architectural factorisation rather than completed fundamental unification.\n\n### 12.1 Current frontier — unresolved dynamical ownership\n\nThe current canon now names most of the architecture surrounding a physical transition: the complete addressed state, admissibility descriptor, active P-law object, physical propagation interface, measurement/registration instrument, retained history and recursive readdressing. What it does **not** yet identify is an independently demonstrated fundamental owner or generator of the transition itself.\n\nThis is a frontier marker, not a new mechanism claim. In particular, the fact that $O_t$ participates in the addressed state and in the $P\\rightarrow(P,O)$ / readdressing cycle does not by itself make the observer the dynamical engine. The unresolved question is where any independently measurable observer-positioned or relational contribution would enter, if it exists at all:\n\n```text\nO / addressed context\n→ admissibility 𝒬 ?\n→ law assembly 𝔠_P ?\n→ physical transition 𝒯_P ?\n→ Instrument / Readdress only ?\n```\n\nThese alternatives are not equivalent and must not be collapsed. The current scientific default remains the strongest adequate P-state/history/boundary/environment account. An observer/context term earns independent physical standing only if an operationally defined variable changes a preregistered outcome beyond that null while ordinary physical channels, information leakage, selection effects and state misdescription are controlled.\n\nA useful smallest-next-test therefore does not begin by asserting that consciousness or observation changes fundamental physics. It asks whether a tightly controlled addressed/observer variable carries independent prospective load in $\\mathcal Q$, $\\mathfrak C_P$, $\\mathcal T_P$, or only in Instrument/Readdress. A null result is informative because it localises the O-layer to registration/context for that regime; a reproducible non-null result would identify the exact boundary requiring deeper physical work.\n\n> **Current frontier: the drivetrain is architecturally specified; dynamical ownership is not yet physically identified.**\n\n## 13. Experimental and promotion discipline'''
          replace_once(spine, old_spine, new_spine)

          old_compression = '''SIPO capstone:\nUpdate_SIPO = Readdress ∘ Instrument_(P→(P,O)) ∘ Propagate_P^(𝔏_P)\n\nDynamic interface promotion:'''
          new_compression = '''SIPO capstone:\nUpdate_SIPO = Readdress ∘ Instrument_(P→(P,O)) ∘ Propagate_P^(𝔏_P)\n\nCurrent foundational frontier:\nThe architectural drivetrain and law-object slots are specified; the fundamental physical owner/generator of transition is not yet identified. Test whether an operational O/context variable carries independent load in 𝒬, 𝔠_P, 𝒯_P, or only Instrument/Readdress against the strongest adequate P-only null.\n\nDynamic interface promotion:'''
          replace_once(spine, old_compression, new_compression)

          old_final = '''The architectural drivetrain remains closed by Module 33. Module 33S1 tightens recursive interface/state representation; Module 33S2 limits higher-address law ownership to the property and regime that actually earn it; Module 33S3 separates local performance from enclosing-scale viability and recovery from inevitable reversal. None reopens the parent capstone. The remaining foundational burden is not another missing arrow; it is to instantiate that drivetrain in concrete physics, recover the established quantum and gravitational regimes, and determine whether the deeper relational architecture earns independent predictive content.'''
          new_final = '''The architectural drivetrain remains closed by Module 33. Module 33S1 tightens recursive interface/state representation; Module 33S2 limits higher-address law ownership to the property and regime that actually earn it; Module 33S3 separates local performance from enclosing-scale viability and recovery from inevitable reversal. None reopens the parent capstone. The remaining foundational burden is not to draw another generic arrow: the architectural transition slots already exist. It is to identify and instantiate the physical dynamical ownership of those slots in concrete regimes, determine whether observer-positioned/contextual structure carries independent load anywhere beyond the strongest adequate P-only account, recover the established quantum and gravitational regimes, and establish whether the deeper relational architecture earns independent predictive content.'''
          replace_once(spine, old_final, new_final)

          old_overview = '''The compressed rule is:\n\n> **Relation makes the whole; descent earns its law.**\n\n## Published research objects'''
          new_overview = '''The compressed rule is:\n\n> **Relation makes the whole; descent earns its law.**\n\n## Current foundational frontier\n\nThe live architecture now specifies the addressed state, admissibility descriptor, active physical-law object, propagation interface, measurement/registration step and recursive readdressing. The remaining open problem is sharper than a generic missing arrow: **the fundamental physical owner/generator of transition has not yet been identified.**\n\nThe observer layer is therefore a live discriminator, not a conclusion. The current canon does not assume that $O$ causes physical dynamics. It asks whether an operational observer/context variable carries independent prospective load in admissibility $\\mathcal Q$, law assembly $\\mathfrak C_P$, the transition rule $\\mathcal T_P$, or only in measurement/registration and readdressing. Any stronger claim must beat the strongest adequate physical-only state/history/boundary/environment account under controlled testing.\n\nSee the [Integrated Master Spine](MKUFT_INTEGRATED_MASTER_SPINE.md) for the current frontier and test boundary.\n\n## Published research objects'''
          replace_once(overview, old_overview, new_overview)

      - name: Commit current-frontier pin
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MKUFT_INTEGRATED_MASTER_SPINE.md START_HERE_PUBLIC_OVERVIEW.md
          git diff --cached --check
          git commit -m 'Pin unresolved dynamical ownership as current MKUFT frontier'
          git push
