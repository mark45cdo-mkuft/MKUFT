name: One-shot close 28C reader interface

on:
  push:
    paths:
      - '.github/workflows/one-shot-close-28c-reader-interface.yml'

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch final cold-reader surfaces
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f"{path}: expected exactly one anchor, found {n}: {old[:140]!r}")
              p.write_text(s.replace(old, new, 1))

          old = """The point is not to add complexity. The point is to make the model **earn either reopening or preservation**. A split does not automatically prove hidden internal state, because the challenge or boundary may have differed; a null does not prove metaphysical completeness, because it closes only the declared target and test family.\n\nThe registered result then returns to SIPO:"""
          new = """The point is not to add complexity. The point is to make the model **earn either reopening or preservation**. A split does not automatically prove hidden internal state, because the challenge or boundary may have differed; a null does not prove metaphysical completeness, because it closes only the declared target and test family.\n\nThe first full prospective protocol that cashes this assay into a native physical/material experiment is [28C — Minimum Decisive FSAI/FSSR Flagship: History-Dependent HCP Magnesium Mechanics](docs/28C_FSAI_FSSR_MINIMUM_DECISIVE_FLAGSHIP_HCP_MAGNESIUM_PROTOCOL.md). It does **not** ask whether magnesium has loading-history effects; materials science already owns twinning, detwinning, hysteresis and constitutive internal variables. It asks a harder question: can the strongest practical predeclared reduced state be made to fail prospectively under a lawful separating reversal, can the smallest measurable physical repair restore held-out closure, does remove/restore behave as predicted, and does an FSSR state-splitting challenge add anything beyond a matched parameter-information design? The protocol is designed to return a clean preservation/null as readily as a positive recruitment result.\n\nThe registered result then returns to SIPO:"""
          replace_once("START_HERE_PUBLIC_OVERVIEW.md", old, new)

          old = """That is the practical content behind the separation between functional identity, closure, property-specific law sufficiency, recoverability, future-state adequacy and SIPO readdressing.\n\n### If you work in AI"""
          new = """That is the practical content behind the separation between functional identity, closure, property-specific law sufficiency, recoverability, future-state adequacy and SIPO readdressing.\n\n### If you work in materials or solid mechanics\n\nThere is now a direct flagship attack surface rather than only a generic example: [28C — Minimum Decisive FSAI/FSSR Flagship: History-Dependent HCP Magnesium Mechanics](docs/28C_FSAI_FSSR_MINIMUM_DECISIVE_FLAGSHIP_HCP_MAGNESIUM_PROTOCOL.md).\n\nDo not test the trivial proposition that cyclic magnesium shows path dependence. Start with the strongest practical constitutive state your field already uses, including the internal variables it legitimately owns. Construct near-matched loading histories without looking at their confirmatory futures. On development data choose one reversal specifically to expose false state equivalence and, under the same budget, choose the best ordinary parameter-information challenge. Freeze both. On fresh specimens ask whether the FSSR challenge exposes a held-out reverse-loading split beyond the preregistered tolerance, whether ordinary state/challenge/boundary/measurement/stochastic explanations remove it, and whether the smallest predeclared measurable microstructural repair restores closure. Remove that repair from the predictive state and demand that the failure return; restore it and demand contraction.\n\nA clean result can be **NULL**: the strong native state survives; an established constitutive variable already closes the future; or the ordinary parameter-information design is equally good. Those are successful discriminations, not failures to produce a story. The MKUFT-specific result exists only if something survives after native ownership is subtracted.\n\n### If you work in AI"""
          replace_once("READER_CONTACT_AND_FAILURE_GUIDE.md", old, new)
          PY

          rm .github/workflows/one-shot-close-28c-reader-interface.yml
          git config user.name "MKUFT Reader Interface"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Close 28C reader-interface parity"
          git push