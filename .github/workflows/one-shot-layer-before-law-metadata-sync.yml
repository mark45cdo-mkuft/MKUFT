name: One-shot Layer Before Law metadata sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-layer-before-law-metadata-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Repair stale Layer Before Law publication headers
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path('docs/26_LAYER_BEFORE_LAW_MKUFT_QUANTUM_GRAVITY_REFRAMING.md'),
              Path('papers/2026-08-16_LAYER_BEFORE_LAW_CANONICAL_PREPRINT_v1.0.md'),
          ]

          replacements = {
              '**Status:** Canonical public preprint - live GitHub canon, standalone DOI pending  ': '**Status:** Canonical public preprint - live GitHub canon; standalone Zenodo paper published  ',
              '**Standalone DOI:** pending frozen deposit': '**Standalone DOI:** [10.5281/zenodo.21971270](https://doi.org/10.5281/zenodo.21971270)',
              '> **Version boundary.** This is the canonical GitHub preprint before standalone DOI deposit. Git history records revisions. The forthcoming DOI will identify the exact frozen publication object; later changes will remain later revisions rather than being silently backdated into that deposit.': '> **Version boundary.** This is the canonical GitHub preprint/live source route associated with the published standalone DOI object. The Zenodo object at DOI `10.5281/zenodo.21971270` is the frozen publication object; later GitHub changes remain later revisions and are not silently backdated into that deposit.',
          }

          for path in paths:
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in replacements.items():
                  if old not in text:
                      raise SystemExit(f'Expected stale marker not found in {path}: {old}')
                  text = text.replace(old, new, 1)
              if text == original:
                  raise SystemExit(f'No change made to {path}')
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit repair and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/one-shot-layer-before-law-metadata-sync.yml
          git add docs/26_LAYER_BEFORE_LAW_MKUFT_QUANTUM_GRAVITY_REFRAMING.md papers/2026-08-16_LAYER_BEFORE_LAW_CANONICAL_PREPRINT_v1.0.md .github/workflows/one-shot-layer-before-law-metadata-sync.yml
          git commit -m 'Sync Layer Before Law published DOI metadata'
          git push
