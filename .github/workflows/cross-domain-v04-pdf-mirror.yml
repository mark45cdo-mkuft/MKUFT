name: Mirror Cross-Domain v0.4 PDF

on:
  push:
    branches:
      - mirror-cross-domain-v04-pdf-20260829

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download and verify exact Zenodo carrier
        shell: bash
        run: |
          set -euo pipefail
          out="publications/CROSS_DOMAIN_COMPOSITIONAL_SCHEMA_v0.4/Cross-Domain_Compositional_Schema_v0.4_2026-08-29.pdf"
          mkdir -p "$(dirname "$out")"
          curl -L --fail --retry 3 "https://zenodo.org/records/22166468/files/Cross-Domain_Compositional_Schema_v0.4_2026-08-29.pdf?download=1" -o "$out"
          test "$(stat -c%s "$out")" = "394810"
          echo "d5a56561e82ca5d64a8766ca8122a956  $out" | md5sum -c -
          echo "bcb5c7618962bac98c2ae0ad097f7bba8e9758d4c86879b6546d037736c73b83  $out" | sha256sum -c -
          head -c 5 "$out" | grep -q '%PDF-'

      - name: Wire exact PDF mirror and guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          pdf = "publications/CROSS_DOMAIN_COMPOSITIONAL_SCHEMA_v0.4/Cross-Domain_Compositional_Schema_v0.4_2026-08-29.pdf"

          for rel in [
              "CROSS_DOMAIN_COMPOSITIONAL_SCHEMA_STANDALONE_PUBLICATION.md",
              "papers/2026-08-29_CROSS_DOMAIN_COMPOSITIONAL_SCHEMA_v0.4.md",
              "publications/CROSS_DOMAIN_COMPOSITIONAL_SCHEMA_v0.4/README.md",
              "publications/README.md",
          ]:
              p = Path(rel)
              s = p.read_text(encoding="utf-8")
              if pdf not in s:
                  s = s.rstrip() + "\n\n**Repository PDF mirror:** [`" + pdf + "`](" + ("./Cross-Domain_Compositional_Schema_v0.4_2026-08-29.pdf" if rel.startswith("publications/CROSS_DOMAIN") else pdf) + ")\n"
                  p.write_text(s, encoding="utf-8")

          p = Path("tools/check_publication_routes.py")
          s = p.read_text(encoding="utf-8")
          needle = '    "publications/ATLD_EVALUATION_PROTOCOL_v1.0_DOI_10.5281_zenodo.21341521.pdf",\n]'
          replacement = '    "publications/ATLD_EVALUATION_PROTOCOL_v1.0_DOI_10.5281_zenodo.21341521.pdf",\n    "' + pdf + '",\n]'
          if pdf not in s:
              if needle not in s:
                  raise SystemExit("FROZEN_PDF_MIRRORS insertion point missing")
              s = s.replace(needle, replacement, 1)
              p.write_text(s, encoding="utf-8")

          Path(".github/workflows/cross-domain-v04-pdf-mirror.yml").unlink(missing_ok=True)
          PY

      - name: Run repository integrity gates
        run: |
          python tools/test_markdown_rendering_checker.py
          python tools/check_markdown_rendering.py
          python tools/check_publication_routes.py
          python tools/test_research_object_identity_checker.py
          python tools/check_research_object_identity.py

      - name: Commit exact mirror
        run: |
          git config user.name "Mark Charles McLaughlin"
          git config user.email "mark45cdo@gmail.com"
          git add -A
          git commit -m "Mirror exact published Cross-Domain v0.4 PDF"
          git push origin HEAD:mirror-cross-domain-v04-pdf-20260829
