## Abstract

History-dependent constitutive mechanics provide a direct test of whether a state representation is sufficient for the future it is asked to predict. This paper specifies a minimum-decisive prospective protocol for the Future-Sufficient Address Invariant / Future-Splitting State Recruitment (FSAI/FSSR) family in HCP magnesium, using AZ31/AZ31B as the default reference system. The protocol does not test the trivial proposition that magnesium exhibits twinning, detwinning, hysteresis, or loading-history effects; those are established materials-science objects. Instead, it starts from the strongest practical predeclared domain-native constitutive state and asks whether a lawful reversal chosen specifically to expose false state equivalence can produce a held-out future split beyond a frozen tolerance. If so, the protocol requires exhaustion of state-matching, challenge, boundary, measurement, stochastic, and probe-induction nulls before recruiting the smallest predeclared measurable physical augmentation that restores held-out closure. A remove/restore test then asks whether predictive failure reopens when that augmentation is removed and contracts when it is restored. In parallel, the FSSR challenge is compared under matched budget with a parameter-information challenge selected by standard experimental-design logic. State sufficiency, challenge-design value, mechanism localisation, and prospective lead relative to a conventional macroscopic marker are reported as four independent verdicts. The experiment is explicitly allowed to return preservation or null results.

## Core discriminator

> **The flagship is not “magnesium has memory.” It is whether a prospectively chosen future can expose exactly where a strong state description stops being enough, whether the smallest physical repair makes it enough again, and whether that way of asking the question beats the strongest ordinary way of asking it.**

The confirmatory target is one preregistered reverse-loading macroscopic stress trajectory. The ordinary comparator is the strongest practical domain-native constitutive state, supplemented where feasible by stronger history-aware and flexible predictive baselines. The FSSR challenge and a standard parameter-information challenge are selected on development data under matched budgets and then frozen before held-out confirmation.

A positive state-recruitment event requires a held-out split beyond tolerance after fair nulls, the smallest predeclared measurable physical augmentation that restores closure, and reopening when that augmentation is removed from the repaired predictive state. Physical mechanism ownership additionally requires native deformation/compensation/restoration evidence; computational deletion is not relabelled as physical ablation.

## Four independent verdicts

1. **State sufficiency:** PRESERVE / REOPEN / FAIL-TO-LOCALISE.
2. **Challenge design:** FSSR-GAIN / EQUIVALENT-NULL / WORSE relative to the matched parameter-information design.
3. **Mechanism localisation:** PHYSICALLY TYPED / PREDICTIVE ONLY / NULL-FAIL.
4. **Prospective lead:** LEAD / SIMULTANEOUS-NULL / REVERSED relative to the frozen macroscopic marker.

Success in one verdict cannot promote another. A strong no-split result is a clean preservation result for the declared target, regime, horizon, challenge family, and tolerance.

