name: One-shot fold FSSR-HCP publication
on:
  push:
    paths:
      - '.github/workflows/one-shot-fold-fssr-hcp-publication.yml'
permissions:
  contents: write
jobs:
  fold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply publication fold
        run: python tools/one_shot_fold_fssr_hcp.py
      - name: Commit result
        run: |
          git config user.name "MKUFT Publication Fold"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Fold FSSR-HCP v1.0 publication candidate through MKUFT"
          git push
