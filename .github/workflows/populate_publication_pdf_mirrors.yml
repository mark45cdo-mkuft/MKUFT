name: Populate frozen publication PDF mirrors

on:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  populate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fetch exact Zenodo PDF objects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publications

          fetch_one() {
            record="$1"
            expected_doi="$2"
            output="$3"
            json="$(mktemp)"
            curl -fsSL "https://zenodo.org/api/records/${record}" -o "$json"

            actual_doi="$(jq -r '.doi // empty' "$json")"
            if [ "$actual_doi" != "$expected_doi" ]; then
              echo "ERROR: Zenodo record ${record} reports DOI '${actual_doi}', expected '${expected_doi}'." >&2
              exit 1
            fi

            mapfile -t keys < <(jq -r '.files[] | select(.key | ascii_downcase | endswith(".pdf")) | .key' "$json")
            mapfile -t urls < <(jq -r '.files[] | select(.key | ascii_downcase | endswith(".pdf")) | (.links.content // .links.self)' "$json")

            if [ "${#keys[@]}" -ne 1 ] || [ "${#urls[@]}" -ne 1 ]; then
              echo "ERROR: Zenodo record ${record} exposes ${#keys[@]} PDF files; expected exactly one." >&2
              printf 'PDF keys: %s\n' "${keys[*]:-NONE}" >&2
              exit 1
            fi

            echo "Record ${record}: ${keys[0]} -> ${output}"
            curl -fsSL "${urls[0]}" -o "$output"
            test "$(head -c 5 "$output")" = '%PDF-'
            test -s "$output"
            sha256sum "$output"
            rm -f "$json"
          }

          fetch_one 21973064 '10.5281/zenodo.21973064' 'publications/MKUFT_RELATIONAL_ARCHITECTURE_v2_DOI_10.5281_zenodo.21973064.pdf'
          fetch_one 17780566 '10.5281/zenodo.17780566' 'publications/HISTORICAL_V1_MKUFT_DOI_10.5281_zenodo.17780566.pdf'
          fetch_one 22058303 '10.5281/zenodo.22058303' 'publications/FUTURE_SPLITTING_STATE_RECRUITMENT_v1.0_DOI_10.5281_zenodo.22058303.pdf'
          fetch_one 22031333 '10.5281/zenodo.22031333' 'publications/ADDRESSED_ADMISSIBLE_FUTURES_v0.1_DOI_10.5281_zenodo.22031333.pdf'
          fetch_one 21971270 '10.5281/zenodo.21971270' 'publications/LAYER_BEFORE_LAW_v1.0_DOI_10.5281_zenodo.21971270.pdf'
          fetch_one 21971425 '10.5281/zenodo.21971425' 'publications/RECURSIVE_CONSTRAINT_CLOSURE_v0.1_DOI_10.5281_zenodo.21971425.pdf'
          fetch_one 21341521 '10.5281/zenodo.21341521' 'publications/ATLD_EVALUATION_PROTOCOL_v1.0_DOI_10.5281_zenodo.21341521.pdf'

      - name: Commit mirrors and remove one-shot carrier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add publications/*.pdf
          git rm .github/workflows/populate_publication_pdf_mirrors.yml
          git commit -m 'Populate frozen publication PDF mirrors'
          git push
