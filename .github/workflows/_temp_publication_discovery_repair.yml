name: Temporary publication discovery reconciliation

on:
  push:
    paths:
      - '.github/workflows/_temp_publication_discovery_repair.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile root reader routes
        shell: python
        run: |
          from pathlib import Path

          # INDEX: make standalone research objects first-class discovery routes.
          p = Path('INDEX.md')
          text = p.read_text(encoding='utf-8')
          anchor = '- [Rights and Licence Notice](RIGHTS_AND_LICENSE_NOTICE.md) — exact-object rights rules.\n'
          addition = (
              '- [Papers and Publications](papers/README.md) — direct human-reader index for standalone papers and preprints.\n'
              '- [Rendering and Publication Integrity](RENDERING_AND_PUBLICATION_INTEGRITY.md) — standing carrier, DOI-freeze, and object-custody rules.\n'
          )
          if addition not in text:
              if anchor not in text:
                  raise RuntimeError('INDEX start-here anchor not found')
              text = text.replace(anchor, anchor + addition, 1)

          start = text.index('## Publications\n')
          end = text.index('## Metadata and discovery\n', start)
          pub = '''## Publications

- [Papers and Publications — reader index](papers/README.md) — authoritative direct route to standalone research outputs.
- [Voynich Manuscript – Systems/Engine Framework](papers/2026-05-20_VOYNICH_MANUSCRIPT_SYSTEMS_ENGINE_FRAMEWORK.md) — human-readable DOI-paper edition; version DOI `10.5281/zenodo.18178638`; [publication record](VOYNICH_STANDALONE_PUBLICATION.md).
- [ATLD v1.0](papers/2026-07-13_ATLD_EVALUATION_PROTOCOL_v1.0.md) — published matched-control evaluation protocol; version DOI `10.5281/zenodo.21341521`; [publication record](ATLD_STANDALONE_PUBLICATION.md); [frozen text mirror](publications/ATLD_Evaluation_Protocol_v1.0/).
- [Recursive Constraint Closure and Reachable-State Geometry — public preprint v0.1](papers/2026-08-15_RECURSIVE_CONSTRAINT_CLOSURE_AND_REACHABLE_STATE_GEOMETRY_PREPRINT.md) — standalone preprint; DOI pending; [publication record](RECURSIVE_CONSTRAINT_CLOSURE_STANDALONE_PUBLICATION.md).
- [Layer Before Law — canonical public preprint v1.0](papers/2026-08-16_LAYER_BEFORE_LAW_CANONICAL_PREPRINT_v1.0.md) — standalone preprint; DOI pending exact frozen deposit; [publication record](LAYER_BEFORE_LAW_STANDALONE_PUBLICATION.md).

Live `docs/` modules remain distinct from standalone paper objects. The [Rendering and Publication Integrity](RENDERING_AND_PUBLICATION_INTEGRITY.md) standard owns that boundary.

'''
          text = text[:start] + pub + text[end:]
          p.write_text(text, encoding='utf-8')

          # README: replace the single-publication framing with the current research-output set.
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          read_anchor = '## Read MKUFT\n\n'
          read_addition = '**Standalone research outputs:** [Papers and Publications](papers/README.md) — DOI papers and current public preprints in one reader-facing route.\n\n'
          if read_addition not in text:
              if read_anchor not in text:
                  raise RuntimeError('README read anchor not found')
              text = text.replace(read_anchor, read_anchor + read_addition, 1)

          start = text.index('## Current standalone publication\n')
          end = text.index('## Evidence and claim discipline\n', start)
          section = '''## Standalone papers and preprints

The repository now keeps paper identity separate from the live modular canon. Use [Papers and Publications](papers/README.md) as the reader-facing index.

### Published DOI papers

- **Voynich Manuscript – Systems/Engine Framework** — version DOI [10.5281/zenodo.18178638](https://doi.org/10.5281/zenodo.18178638); [GitHub reading edition](papers/2026-05-20_VOYNICH_MANUSCRIPT_SYSTEMS_ENGINE_FRAMEWORK.md); [publication record](VOYNICH_STANDALONE_PUBLICATION.md).
- **Active Traversal and Load-Bearing Dependency in Typed Knowledge Architectures: A Matched-Control Evaluation Protocol for AI Systems** — version 1.0, 13 July 2026; version DOI [10.5281/zenodo.21341521](https://doi.org/10.5281/zenodo.21341521); concept DOI [10.5281/zenodo.21341520](https://doi.org/10.5281/zenodo.21341520); [GitHub paper route](papers/2026-07-13_ATLD_EVALUATION_PROTOCOL_v1.0.md); [publication record](ATLD_STANDALONE_PUBLICATION.md).

### Public preprints awaiting standalone DOI

- **Recursive Constraint Closure and Reachable-State Geometry: An Addressed Formalism for Adaptive Systems with Changing Possibility Spaces** — [public preprint](papers/2026-08-15_RECURSIVE_CONSTRAINT_CLOSURE_AND_REACHABLE_STATE_GEOMETRY_PREPRINT.md); [publication record](RECURSIVE_CONSTRAINT_CLOSURE_STANDALONE_PUBLICATION.md).
- **Layer Before Law: An Addressed Architecture for Relational Admissibility, Effective Law Selection, and Quantum-Gravitational Recovery** — [canonical public preprint v1.0](papers/2026-08-16_LAYER_BEFORE_LAW_CANONICAL_PREPRINT_v1.0.md); standalone DOI pending frozen deposit; [publication record](LAYER_BEFORE_LAW_STANDALONE_PUBLICATION.md).

The exact DOI-bearing Zenodo object controls a frozen published version. Live GitHub modules and Drive reading editions do not silently replace it. See [Rendering and Publication Integrity](RENDERING_AND_PUBLICATION_INTEGRITY.md).

'''
          text = text[:start] + section + text[end:]
          p.write_text(text, encoding='utf-8')

      - name: Validate and commit
        run: |
          python tools/check_markdown_rendering.py
          python tools/check_publication_routes.py
          git config user.name 'mark45cdo-mkuft'
          git config user.email 'mark45cdo@gmail.com'
          git add README.md INDEX.md
          git commit -m 'Reconcile MKUFT paper and publication discovery routes'
          git push origin HEAD:main
