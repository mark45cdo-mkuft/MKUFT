name: Carrier hygiene branch verification

on:
  push:
    branches:
      - cross-domain-v03-carrier-hygiene

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Self-test Markdown guard
        run: python tools/test_markdown_rendering_checker.py
      - name: Check Markdown rendering
        run: python tools/check_markdown_rendering.py
      - name: Check publication routes
        run: python tools/check_publication_routes.py
      - name: Check ATLD2 routes
        run: python tools/check_atld2_publication_routes.py
      - name: Self-test research object guard
        run: python tools/test_research_object_identity_checker.py
      - name: Check research object identity
        run: python tools/check_research_object_identity.py
      - name: Check withdrawn carriers are not current
        run: |
          test ! -e publications/module-reading-editions/25_LOAD_BEARING_INVARIANTS_AND_WHOLE_SYSTEM_DEFORMATION.pdf
          test ! -e publications/module-reading-editions/32S3_RELATIONAL_BRACKETS_COMPLETION_GEOMETRY_AND_I_TO_P_ADMISSIBILITY.pdf
          ! grep -q '25_LOAD_BEARING_INVARIANTS_AND_WHOLE_SYSTEM_DEFORMATION.pdf' publications/module-reading-editions/SHA256SUMS.txt
          ! grep -q '32S3_RELATIONAL_BRACKETS_COMPLETION_GEOMETRY_AND_I_TO_P_ADMISSIBILITY.pdf' publications/module-reading-editions/SHA256SUMS.txt
          grep -q '25 — Load-Bearing Invariants and Whole-System Deformation' publications/module-reading-editions/README.md
          grep -q '32S3 — Relational Brackets, Completion Geometry, and I→P Admissibility' publications/module-reading-editions/README.md
          grep -q '28A — Cross-Domain Compositional Schema Bell/CHSH Calibration' publications/module-reading-editions/README.md
          grep -q '33S7A — Future-Sufficient Address Invariant and Layer-Before-Law Precedence' publications/module-reading-editions/README.md
