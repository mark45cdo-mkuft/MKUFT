name: One-shot audit FSSR-HCP fold
on:
  push:
    paths:
      - '.github/workflows/one-shot-audit-fssr-hcp-fold.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Run standing publication and identity gates
        run: |
          python tools/test_markdown_rendering_checker.py
          python tools/check_markdown_rendering.py
          python tools/check_publication_routes.py
          python tools/check_atld2_publication_routes.py
          python tools/test_research_object_identity_checker.py
          python tools/check_research_object_identity.py
      - name: Assert FSSR-HCP publication fold routes
        run: |
          test -f papers/2026-09-04_FSSR_HCP_MAGNESIUM_MINIMUM_DECISIVE_PROTOCOL_v1.0.md
          test -f FSSR_HCP_MAGNESIUM_PROTOCOL_STANDALONE_PUBLICATION.md
          test -f publications/FSSR_HCP_MAGNESIUM_MINIMUM_DECISIVE_PROTOCOL_v1.0/README.md
          test -f publications/FSSR_HCP_MAGNESIUM_MINIMUM_DECISIVE_PROTOCOL_v1.0/PREPUBLICATION_QA.md
          test -f publications/FSSR_HCP_MAGNESIUM_MINIMUM_DECISIVE_PROTOCOL_v1.0/SHA256SUMS.txt
          grep -Fq '10.5281/zenodo.22309144' docs/28C_FSAI_FSSR_MINIMUM_DECISIVE_FLAGSHIP_HCP_MAGNESIUM_PROTOCOL.md
          grep -Fq '10.5281/zenodo.22309144' docs/33S7_FUTURE_SPLITTING_STATE_RECRUITMENT_STATE_ADEQUACY_AND_PROSPECTIVE_MECHANISM_LOCALISATION.md
          grep -Fq '10.5281/zenodo.22309144' docs/33S7A_FUTURE_SUFFICIENT_ADDRESS_INVARIANT_AND_LAYER_BEFORE_LAW_PRECEDENCE.md
          grep -Fq '52192346256eb3c5895ed466f913b23ce1bb3a8476fdc555edc2abff2dc6646a' publications/FSSR_HCP_MAGNESIUM_MINIMUM_DECISIVE_PROTOCOL_v1.0/SHA256SUMS.txt
          grep -Fq 'Empirical status remains OPEN' docs/28C_FSAI_FSSR_MINIMUM_DECISIVE_FLAGSHIP_HCP_MAGNESIUM_PROTOCOL.md
          grep -Fq 'not FSSR v1.1' FSSR_HCP_MAGNESIUM_PROTOCOL_STANDALONE_PUBLICATION.md
          grep -Fq 'bibliographic reference lists and typed related-object' docs/34_RESEARCH_OBJECT_IDENTITY_RELEASE_INTEGRITY_AND_REPRODUCIBILITY.md
          grep -Fq 'Carrier fit is part of publication correctness' RENDERING_AND_PUBLICATION_INTEGRITY.md
          test ! -e tools/one_shot_fold_fssr_hcp.py
          test ! -e .github/workflows/one-shot-fold-fssr-hcp-publication.yml
      - name: Remove audit scaffold after green run
        run: |
          rm .github/workflows/one-shot-audit-fssr-hcp-fold.yml
          git config user.name "MKUFT Publication Audit"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Close FSSR-HCP publication-fold audit scaffold"
          git push
