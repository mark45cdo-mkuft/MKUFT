name: Fold Cross-Domain v0.4

on:
  push:
    branches:
      - fold-cross-domain-v0.4-20260829

permissions:
  contents: write

jobs:
  fold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fold
        run: python tools/_apply_cross_domain_v04_fold.py

      - name: Run repository integrity gates
        run: |
          python tools/test_markdown_rendering_checker.py
          python tools/check_markdown_rendering.py
          python tools/check_publication_routes.py
          python tools/test_research_object_identity_checker.py
          python tools/check_research_object_identity.py

      - name: Commit folded state
        run: |
          git config user.name "Mark Charles McLaughlin"
          git config user.email "mark45cdo@gmail.com"
          git add -A
          git commit -m "Fold published Cross-Domain v0.4 through MKUFT [v0.4-folded]"
          git push origin HEAD:fold-cross-domain-v0.4-20260829
