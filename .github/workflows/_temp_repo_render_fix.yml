name: Temporary MKUFT Markdown rendering repair

on:
  push:
    paths:
      - '.github/workflows/_temp_repo_render_fix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize every Markdown file to GitHub-safe math
        shell: python
        run: |
          from pathlib import Path
          import re, unicodedata

          paths = sorted(p for p in Path('.').rglob('*.md') if '.git' not in p.parts and '.github' not in p.parts)
          changed=[]

          for p in paths:
              original=p.read_text(encoding='utf-8')
              # Compatibility repair applies to every Markdown context, including examples.
              source=re.sub(r'\\operatorname\{([^{}]+)\}', r'\\mathrm{\1}', original)
              lines=source.splitlines()
              out=[]
              in_code=False
              display_delim=None

              for line in lines:
                  stripped=line.strip()

                  # Preserve existing fenced blocks verbatim apart from the global macro repair above.
                  if stripped.startswith('```') and display_delim is None:
                      in_code=not in_code
                      out.append(line)
                      continue
                  if in_code:
                      out.append(line)
                      continue

                  # If inside a legacy display block, close only with its matching delimiter.
                  if display_delim is not None:
                      closing = (display_delim == '$$' and stripped == '$$') or (display_delim == r'\[' and stripped == r'\]')
                      if closing:
                          out.append('```')
                          display_delim=None
                      else:
                          out.append(line)
                      continue

                  # Same-line legacy display delimiters.
                  if stripped.startswith(r'\[') and stripped.endswith(r'\]') and len(stripped) > 4:
                      body=stripped[2:-2].strip()
                      out.extend(['```math', body, '```'])
                      continue
                  if stripped.startswith('$$') and stripped.endswith('$$') and len(stripped) > 4:
                      body=stripped[2:-2].strip()
                      out.extend(['```math', body, '```'])
                      continue

                  # Open legacy display blocks.
                  if stripped == '$$':
                      out.append('```math')
                      display_delim='$$'
                      continue
                  if stripped == r'\[':
                      out.append('```math')
                      display_delim=r'\['
                      continue
                  if stripped == r'\]':
                      raise RuntimeError(f'orphan \\] in {p}')

                  # Inline LaTeX delimiters are not GitHub Markdown math delimiters.
                  line=line.replace(r'\(', '$').replace(r'\)', '$')
                  out.append(line)

              if display_delim is not None:
                  raise RuntimeError(f'unclosed display math block {display_delim} in {p}')

              revised='\n'.join(out)+'\n'
              if revised != original:
                  p.write_text(revised, encoding='utf-8')
                  changed.append(str(p))

          print('CHANGED_FILES', len(changed))
          for p in changed: print(p)

          # Whole-repo post-repair validation.
          problems=[]
          for p in paths:
              text=p.read_text(encoding='utf-8')
              if '\ufffd' in text: problems.append(f'{p}: replacement character')
              if any(unicodedata.category(c)=='Cc' and c not in '\n\r\t' for c in text): problems.append(f'{p}: hidden control')
              if r'\operatorname' in text: problems.append(f'{p}: operatorname remains')

              in_fence=False
              for n,line in enumerate(text.splitlines(),1):
                  s=line.strip()
                  if s.startswith('```'):
                      in_fence=not in_fence
                      continue
                  if in_fence: continue
                  if s in ('$$', r'\[', r'\]'):
                      problems.append(f'{p}:{n}: legacy display delimiter remains')
                  if r'\(' in s or r'\)' in s:
                      problems.append(f'{p}:{n}: legacy inline delimiter remains')

          if problems:
              print('\n'.join(problems))
              raise RuntimeError(f'post-repair audit found {len(problems)} problems')
      - name: Commit repo-wide rendering repair
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'mark45cdo-mkuft'
          git config user.email 'mark45cdo@gmail.com'
          git add '*.md' docs papers publications || true
          git add -u
          git commit -m 'Repair GitHub math rendering across MKUFT canon'
          git push origin HEAD:main
