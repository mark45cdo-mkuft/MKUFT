name: One-shot 25C professional reading-edition bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/render-25c-house-style.yml'

permissions:
  contents: write

jobs:
  bridge-audited-carrier:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch exact reader-audited 25C carrier
        run: |
          set -euo pipefail
          mkdir -p publications/module-reading-editions
          curl -L --fail --retry 3 \
            'https://drive.usercontent.google.com/download?id=1TdWqWlN5sBg2RFO2CvK81qda9wqKyKHe&export=download&confirm=t' \
            -o publications/module-reading-editions/25C_RESIDUAL_INSTRUMENT_GENERATION_AND_PROTECTED_DISCOVERY_BOUNDARY.pdf
          test "$(stat -c '%s' publications/module-reading-editions/25C_RESIDUAL_INSTRUMENT_GENERATION_AND_PROTECTED_DISCOVERY_BOUNDARY.pdf)" = '86673'
          echo '18c3816fa252eab365f3cb566c457c1729d88388e7894b847c46459b7f2fd2ff  publications/module-reading-editions/25C_RESIDUAL_INSTRUMENT_GENERATION_AND_PROTECTED_DISCOVERY_BOUNDARY.pdf' | sha256sum -c -

      - name: Commit only the verified carrier
        run: |
          set -euo pipefail
          git config user.name 'MKUFT Publication Bridge'
          git config user.email 'actions@users.noreply.github.com'
          git add publications/module-reading-editions/25C_RESIDUAL_INSTRUMENT_GENERATION_AND_PROTECTED_DISCOVERY_BOUNDARY.pdf
          if git diff --cached --quiet; then
            echo 'Verified carrier already present.'
          else
            git commit -m 'Add audited Module 25C professional reading edition'
            git push origin HEAD:main
          fi
