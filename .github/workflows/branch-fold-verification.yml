name: Cross-Domain v0.3 branch verification

on:
  push:
    branches: [fold-cross-domain-v0.3-20260829]

permissions:
  contents: write

jobs:
  integrity-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Apply publication-fold consistency repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          # Renderer-safe mathematical carriers: same mathematics, GitHub-supported TeX.
          for path in [
              Path("docs/33S7A_FUTURE_SUFFICIENT_ADDRESS_INVARIANT_AND_LAYER_BEFORE_LAW_PRECEDENCE.md"),
              Path("papers/2026-08-29_CROSS_DOMAIN_COMPOSITIONAL_SCHEMA_v0.3.md"),
          ]:
              text = path.read_text(encoding="utf-8")
              repaired = text.replace(r"\operatorname{", r"\mathrm{")
              if repaired != text:
                  path.write_text(repaired, encoding="utf-8")

          # The publication checker must assert the actual renderer-safe canonical spelling.
          checker = Path("tools/check_publication_routes.py")
          text = checker.read_text(encoding="utf-8")
          repaired = text.replace(r"\\operatorname{Eval}", r"\\mathrm{Eval}")
          repaired = repaired.replace(r"\\operatorname{LB}", r"\\mathrm{LB}")
          if repaired != text:
              checker.write_text(repaired, encoding="utf-8")

          # Preserve the receiver-side Zenodo MD5 witness on the archive index itself.
          pubs = Path("publications/README.md")
          text = pubs.read_text(encoding="utf-8")
          md5_line = "Zenodo MD5: `985801aceccb3ce3effe6da1f4d1d496`  \n"
          anchor = "Licence of exact v0.3 deposit: CC BY 4.0\n"
          if md5_line.strip() not in text and anchor in text:
              text = text.replace(anchor, anchor + md5_line, 1)
              pubs.write_text(text, encoding="utf-8")
          PY

      - name: Self-test the Markdown rendering guard
        run: python tools/test_markdown_rendering_checker.py
      - name: Check user-facing Markdown rendering contract
        run: python tools/check_markdown_rendering.py
      - name: Check publication discovery and DOI custody
        run: python tools/check_publication_routes.py
      - name: Check ATLD 2 publication and canon-fold routes
        run: python tools/check_atld2_publication_routes.py
      - name: Self-test the research-object identity guard
        run: python tools/test_research_object_identity_checker.py
      - name: Check research-object identity and release manifests
        run: python tools/check_research_object_identity.py

      - name: Commit verified consistency repairs when required
        run: |
          if git diff --quiet; then
            echo "No consistency repair required."
            exit 0
          fi
          git config user.name "Mark Charles McLaughlin"
          git config user.email "mark45cdo@gmail.com"
          git add docs/33S7A_FUTURE_SUFFICIENT_ADDRESS_INVARIANT_AND_LAYER_BEFORE_LAW_PRECEDENCE.md papers/2026-08-29_CROSS_DOMAIN_COMPOSITIONAL_SCHEMA_v0.3.md tools/check_publication_routes.py publications/README.md
          git commit -m "Close Cross-Domain publication rendering and custody checks"
          git push origin HEAD:fold-cross-domain-v0.3-20260829
