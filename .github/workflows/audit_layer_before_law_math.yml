name: Audit Layer Before Law math source

on:
  push:
    paths:
      - '.github/workflows/audit_layer_before_law_math.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit canonical math source and checksums
        shell: python
        run: |
          from pathlib import Path
          import hashlib, re

          targets = [
              Path('papers/2026-08-16_LAYER_BEFORE_LAW_CANONICAL_PREPRINT_v1.0.md'),
              Path('docs/26_LAYER_BEFORE_LAW_MKUFT_QUANTUM_GRAVITY_REFRAMING.md'),
          ]

          for path in targets:
              text = path.read_text(encoding='utf-8')
              data = path.read_bytes()
              print(f'FILE {path}')
              print('SHA256', hashlib.sha256(data).hexdigest())
              print('MATH_FENCES', text.count('```math'))
              print('OPERATORNAME', text.count('\\operatorname'))
              print('LEGACY_STANDALONE_DOLLARS', text.count('\n$$\n'))
              commands = sorted(set(re.findall(r'\\([A-Za-z]+)', text)))
              print('COMMANDS', ','.join(commands))
              if text.count('```math') != 34:
                  raise RuntimeError(f'Expected 34 math fences in {path}')
              if '\\operatorname' in text:
                  raise RuntimeError(f'Unsupported operatorname remains in {path}')
              if '\n$$\n' in text:
                  raise RuntimeError(f'Legacy standalone $$ remains in {path}')

          if targets[0].read_text(encoding='utf-8') != targets[1].read_text(encoding='utf-8'):
              raise RuntimeError('Canonical paper and docs/26 owner have diverged')
          print('CANONICAL_OWNERS_IDENTICAL yes')
