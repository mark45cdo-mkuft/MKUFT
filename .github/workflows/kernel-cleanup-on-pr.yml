name: Kernel cleanup on trigger PR

on:
  pull_request:
    types: [opened]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup:
    if: github.head_ref == 'kernel-cleanup-trigger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove public kernel material and stale routes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def remove_section(text, start, end):
              if start not in text:
                  return text
              a = text.index(start)
              b = text.index(end, a + len(start))
              return text[:a] + text[b:]

          p = 'README.md'
          t = read(p)
          t = remove_section(t, 'with the operational kernel:\n\n```text\nLayer → Boundary → Node → Transition → Cost → Coherence → Observer → Falsifier → Outcome\n```\n\n', 'The public claim is')
          t = '\n'.join(x for x in t.splitlines() if 'docs/19_MKUFT_RECONSTITUTION_KERNEL.md' not in x) + '\n'
          write(p, t)

          p = 'START_HERE_PUBLIC_OVERVIEW.md'
          t = read(p)
          t = remove_section(t, '## The operational kernel\n', '## The four layers\n')
          t = '\n'.join(x for x in t.splitlines() if 'docs/19_MKUFT_RECONSTITUTION_KERNEL.md' not in x) + '\n'
          write(p, t)

          p = 'CANON_MAP.md'
          t = read(p)
          t = remove_section(t, '### 8. Reconstitution Kernel\n', '### 9. GRACE Traversal Rule\n')
          t = '\n'.join(x for x in t.splitlines() if 'docs/19_MKUFT_RECONSTITUTION_KERNEL.md' not in x) + '\n'
          write(p, t)

          p = 'docs/24_MKUFT_CROSS_SUPPORT_AND_TRAVERSAL_MAP.md'
          t = read(p)
          t = remove_section(t, '## 3. Traversal kernel\n', '## 4. Core dependency groups\n')
          t = '\n'.join(x for x in t.splitlines() if 'docs/19_MKUFT_RECONSTITUTION_KERNEL.md' not in x and x.strip() != '→ kernel') + '\n'
          write(p, t)

          Path('.github/workflows/kernel-cleanup-on-pr.yml').unlink()
          PY

          ! grep -R --line-number --fixed-string 'docs/19_MKUFT_RECONSTITUTION_KERNEL.md' README.md START_HERE_PUBLIC_OVERVIEW.md CANON_MAP.md docs
          ! grep -R --line-number --fixed-string 'Layer → Boundary → Node → Transition → Cost → Coherence → Observer → Falsifier → Outcome' README.md START_HERE_PUBLIC_OVERVIEW.md CANON_MAP.md docs/24_MKUFT_CROSS_SUPPORT_AND_TRAVERSAL_MAP.md

      - name: Commit to main and close trigger PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Clean public canon after kernel removal'
          git push origin HEAD:main
          gh pr close "$PR_NUMBER" --repo "${{ github.repository }}" --delete-branch
