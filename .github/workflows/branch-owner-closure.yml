name: Cross-Domain v0.3 owner closure

on:
  push:
    branches:
      - fold-cross-domain-v0.3-20260829

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Align temporary repair script with checker constants
        run: sed -i 's/CROSS_DOMAIN_CURRENT/CROSS_DOMAIN_VERSION/g' tools/_temp_cross_domain_owner_closure.py
      - name: Apply owner closure
        run: python tools/_temp_cross_domain_owner_closure.py
      - name: Bind Canon route to published DOI
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("CANON_MAP.md")
          text = path.read_text(encoding="utf-8")
          old = "- **28A — Cross-Domain Compositional Schema Bell/CHSH Calibration:** hostile known-answer calibration of target-relative preserve/refine/reopen/refuse behaviour; physical Phase-0 delta remains null."
          new = "- **28A — Cross-Domain Compositional Schema Bell/CHSH Calibration:** hostile known-answer calibration of target-relative preserve/refine/reopen/refuse behaviour for the published Cross-Domain v0.3 result, DOI `10.5281/zenodo.22166005`; physical Phase-0 delta remains null."
          if old in text:
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Self-test Markdown guard
        run: python tools/test_markdown_rendering_checker.py
      - name: Check Markdown rendering
        run: python tools/check_markdown_rendering.py
      - name: Check publication routes
        run: python tools/check_publication_routes.py
      - name: Check ATLD2 routes
        run: python tools/check_atld2_publication_routes.py
      - name: Self-test research object guard
        run: python tools/test_research_object_identity_checker.py
      - name: Check research object identity
        run: python tools/check_research_object_identity.py
      - name: Commit verified owner closure
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Owner closure already present."
            exit 0
          fi
          git config user.name "Mark Charles McLaughlin"
          git config user.email "mark45cdo@gmail.com"
          git add README.md CANON_MAP.md tools/check_publication_routes.py docs/25_LOAD_BEARING_INVARIANTS_AND_WHOLE_SYSTEM_DEFORMATION.md docs/32S3_RELATIONAL_BRACKETS_COMPLETION_GEOMETRY_AND_I_TO_P_ADMISSIBILITY.md
          git commit -m "Complete Cross-Domain v0.3 owner propagation"
          git push origin HEAD:fold-cross-domain-v0.3-20260829
