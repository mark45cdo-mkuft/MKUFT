name: One-shot close published FSSR-HCP state
on:
  push:
    paths:
      - '.github/workflows/one-shot-close-fssr-hcp-published-state.yml'
permissions:
  contents: write
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  close-published-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify Zenodo and correct published-state fold
        run: python tools/one_shot_close_published_fssr_hcp.py
      - name: Run publication, rendering, and identity gates
        run: |
          python tools/test_markdown_rendering_checker.py
          python tools/check_markdown_rendering.py
          python tools/check_publication_routes.py
          python tools/check_atld2_publication_routes.py
          python tools/test_research_object_identity_checker.py
          python tools/check_research_object_identity.py
          test -f publications/FSSR_HCP_MAGNESIUM_MINIMUM_DECISIVE_PROTOCOL_v1.0/FSSR_HCP_MAGNESIUM_MINIMUM_DECISIVE_PROTOCOL_v1.0_DOI_10.5281_zenodo.22309144_FINAL.pdf
          printf '%s  %s\n' '52192346256eb3c5895ed466f913b23ce1bb3a8476fdc555edc2abff2dc6646a' 'publications/FSSR_HCP_MAGNESIUM_MINIMUM_DECISIVE_PROTOCOL_v1.0/FSSR_HCP_MAGNESIUM_MINIMUM_DECISIVE_PROTOCOL_v1.0_DOI_10.5281_zenodo.22309144_FINAL.pdf' | sha256sum -c -
          grep -Fq '**DOI state:** PUBLISHED' FSSR_HCP_MAGNESIUM_PROTOCOL_STANDALONE_PUBLICATION.md
          grep -Fq '**Zenodo publication/DOI registration:** CLOSED' FSSR_HCP_MAGNESIUM_PROTOCOL_STANDALONE_PUBLICATION.md
          grep -Fq 'receiver-side publication identity verified' docs/28C_FSAI_FSSR_MINIMUM_DECISIVE_FLAGSHIP_HCP_MAGNESIUM_PROTOCOL.md
          grep -Fq 'Zenodo v1.0 publication' papers/README.md
          grep -Fq 'Postpublication receiver verification' publications/FSSR_HCP_MAGNESIUM_MINIMUM_DECISIVE_PROTOCOL_v1.0/README.md
      - name: Commit published-state closure and remove one-shot helpers
        run: |
          rm .github/workflows/one-shot-close-fssr-hcp-published-state.yml
          rm tools/one_shot_close_published_fssr_hcp.py
          git config user.name 'MKUFT Publication Custody'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Close published FSSR-HCP v1.0 custody and canon fold'
          git push
