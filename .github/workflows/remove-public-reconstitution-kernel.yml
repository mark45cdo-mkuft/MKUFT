name: Remove public reconstitution kernel

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-public-reconstitution-kernel.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove kernel material and stale routes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def remove_section(text, start, end):
              if start not in text:
                  return text
              a = text.index(start)
              if end not in text[a + len(start):]:
                  raise RuntimeError(f'End marker not found for section beginning {start!r}')
              b = text.index(end, a + len(start))
              return text[:a] + text[b:]

          # README: remove the public operational-kernel disclosure and route.
          p = 'README.md'
          t = read(p)
          t = remove_section(
              t,
              'with the operational kernel:\n\n```text\nLayer → Boundary → Node → Transition → Cost → Coherence → Observer → Falsifier → Outcome\n```\n\n',
              'The public claim is'
          )
          t = '\n'.join(line for line in t.splitlines() if 'docs/19_MKUFT_RECONSTITUTION_KERNEL.md' not in line) + '\n'
          write(p, t)

          # Public overview: remove the operational-kernel section and route.
          p = 'START_HERE_PUBLIC_OVERVIEW.md'
          t = read(p)
          t = remove_section(t, '## The operational kernel\n', '## The four layers\n')
          t = '\n'.join(line for line in t.splitlines() if 'docs/19_MKUFT_RECONSTITUTION_KERNEL.md' not in line) + '\n'
          write(p, t)

          # Canon map: remove the kernel route and dedicated module entry.
          p = 'CANON_MAP.md'
          t = read(p)
          t = remove_section(t, '### 8. Reconstitution Kernel\n', '### 9. GRACE Traversal Rule\n')
          t = '\n'.join(line for line in t.splitlines() if 'docs/19_MKUFT_RECONSTITUTION_KERNEL.md' not in line) + '\n'
          write(p, t)

          # Cross-support map: remove the kernel traversal section, route node,
          # dependency entry, and registry row.
          p = 'docs/24_MKUFT_CROSS_SUPPORT_AND_TRAVERSAL_MAP.md'
          t = read(p)
          t = remove_section(t, '## 3. Traversal kernel\n', '## 4. Core dependency groups\n')
          filtered = []
          for line in t.splitlines():
              if 'docs/19_MKUFT_RECONSTITUTION_KERNEL.md' in line:
                  continue
              if line.strip() == '→ kernel':
                  continue
              filtered.append(line)
          write(p, '\n'.join(filtered) + '\n')

          # The kernel document was already removed from the public repository.
          # Remove this one-time workflow from the resulting commit as well.
          Path('.github/workflows/remove-public-reconstitution-kernel.yml').unlink()
          PY

          # Hard checks: no public path references or exact private recovery seed remain.
          if grep -R --line-number --fixed-string 'docs/19_MKUFT_RECONSTITUTION_KERNEL.md' README.md START_HERE_PUBLIC_OVERVIEW.md CANON_MAP.md docs; then
            echo 'Stale kernel path remains.' >&2
            exit 1
          fi
          if grep -R --line-number --fixed-string 'Layer → Boundary → Node → Transition → Cost → Coherence → Observer → Falsifier → Outcome' README.md START_HERE_PUBLIC_OVERVIEW.md CANON_MAP.md docs/24_MKUFT_CROSS_SUPPORT_AND_TRAVERSAL_MAP.md; then
            echo 'Exact recovery seed remains on a primary public route.' >&2
            exit 1
          fi

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove internal reconstitution kernel from public canon'
          git push
