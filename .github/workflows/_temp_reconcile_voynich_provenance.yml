name: Temporary Voynich provenance reconciliation

on:
  push:
    paths:
      - '.github/workflows/_temp_reconcile_voynich_provenance.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile Voynich publication identity
        shell: python
        run: |
          from pathlib import Path

          p = Path('PROVENANCE_DOI_AND_ATTRIBUTION.md')
          text = p.read_text(encoding='utf-8')
          old = '''Archived citation identity recorded in the project provenance trail:

```text
Voynich Manuscript – Systems/Engine Framework
Author: Mark Charles McLaughlin
Concept DOI: 10.5281/zenodo.18178637
```

The concept DOI is present in dated project correspondence from 3 February 2026, where the Voynich Systems/Engine Framework is described as a separate archived body of work alongside the MKUFT Zenodo publication. This records the DOI in the historical provenance trail without importing any unstated licence, publication-state, or version metadata into the current repository.
'''
          new = '''Verified publication identity:

```text
Voynich Manuscript – Systems/Engine Framework
Author: Mark Charles McLaughlin
Version DOI: 10.5281/zenodo.18178638
Concept DOI: 10.5281/zenodo.18178637
```

The concept DOI is present in dated project correspondence from 3 February 2026. The version DOI and DOI-version manuscript have since been independently recovered from the research archive and publication trail. The repository now exposes a direct human-readable paper route at `papers/2026-05-20_VOYNICH_MANUSCRIPT_SYSTEMS_ENGINE_FRAMEWORK.md` and a compact publication record at `VOYNICH_STANDALONE_PUBLICATION.md`.

The version DOI identifies the exact frozen publication version. The concept DOI identifies the continuing Zenodo record family. Neither DOI imports the MKUFT backbone licence into the Voynich paper, and the exact Voynich licence must still be taken from the corresponding deposited record or source material.
'''
          if old not in text:
              raise RuntimeError('Voynich provenance anchor not found')
          text = text.replace(old, new, 1)

          old2 = '''The Voynich concept DOI is a provenance and citation anchor. Its exact current publication status, licence, and version-specific rights should be read from the corresponding Zenodo record or deposited source material and should not be inferred from the MKUFT backbone licence. Until those exact record details are independently retrieved, repository metadata should not silently invent them.
'''
          new2 = '''The Voynich version and concept DOIs are provenance and citation anchors. The exact licence and version-specific rights must be read from the corresponding Zenodo record or deposited source material and must not be inferred from the MKUFT backbone licence. Repository metadata must not silently invent a licence that has not been independently verified.
'''
          if old2 not in text:
              raise RuntimeError('Voynich stale-rights anchor not found')
          p.write_text(text.replace(old2, new2, 1), encoding='utf-8')

          p = Path('MODULE_RIGHTS_MATRIX.md')
          text = p.read_text(encoding='utf-8')
          old = '''The Voynich concept DOI recorded in `PROVENANCE_DOI_AND_ATTRIBUTION.md` is retained as a provenance/citation anchor. Its exact publication state, version-specific licence and rights must be taken from the corresponding deposited record or source material rather than inferred from the MKUFT licence.
'''
          new = '''The Voynich standalone paper is identified by version DOI `10.5281/zenodo.18178638` and concept DOI `10.5281/zenodo.18178637`. Its exact version-specific licence and rights must be taken from the corresponding deposited record or source material rather than inferred from the MKUFT licence. The GitHub reading edition and publication record do not broaden that licence.
'''
          if old not in text:
              raise RuntimeError('Voynich rights anchor not found')
          text = text.replace(old, new, 1)

          anchor = '- [ATLD Standalone Publication](ATLD_STANDALONE_PUBLICATION.md) as a repository publication record; the exact manuscript identified by its DOI retains the CC BY-NC-SA 4.0 licence stated on that manuscript and record\n'
          addition = '''- [Voynich Standalone Publication](VOYNICH_STANDALONE_PUBLICATION.md) as a repository publication record; the exact deposited Voynich object controls its own licence and rights identity
- [Papers and Publications](papers/README.md) as the public discovery index; index visibility does not alter the rights of any linked object
- [Rendering and Publication Integrity](RENDERING_AND_PUBLICATION_INTEGRITY.md) as a repository integrity standard; it grants no licence to the scientific works it indexes
'''
          if addition not in text:
              if anchor not in text:
                  raise RuntimeError('rights top-level anchor not found')
              text = text.replace(anchor, anchor + addition, 1)
          p.write_text(text, encoding='utf-8')

      - name: Validate and commit
        run: |
          python tools/check_markdown_rendering.py
          python tools/check_publication_routes.py
          git config user.name 'mark45cdo-mkuft'
          git config user.email 'mark45cdo@gmail.com'
          git add PROVENANCE_DOI_AND_ATTRIBUTION.md MODULE_RIGHTS_MATRIX.md
          git commit -m 'Reconcile Voynich version DOI and publication rights routing'
          git push origin HEAD:main
